# VeriProof AI/ML Pipeline Configuration
pipeline_name: "VeriProof Document Intelligence & Forensic Engine"
version: "1.0.0"
master_random_seed: 20261009

paths:
  dataset_root: "datasets"
  splits_manifest: "datasets/splits/master_split_manifest.csv"
  casia2_split: "datasets/splits/casia2_splits.csv"
  idspace_split: "datasets/splits/idspace_splits.csv"
  funsd_split: "datasets/splits/funsd_splits.csv"
  synthetic_forensics_split: "datasets/splits/synthetic_image_forensics_splits.csv"
  synthetic_ocr_split: "datasets/splits/synthetic_ocr_splits.csv"
  synthetic_anomaly_split: "datasets/splits/synthetic_anomaly_splits.csv"
  synthetic_crypto_split: "datasets/splits/synthetic_crypto_splits.csv"
  model_registry_dir: "ml/artifacts/models"
  reports_dir: "ml/reports"

tasks:
  image_forensics:
    enabled: true
    model_type: "gradient_boosting_forensic_classifier"
    feature_extractor: "ela_noise_texture"
    hyperparameters:
      n_estimators: 100
      max_depth: 5
      learning_rate: 0.08
      random_state: 20261009
    decision_threshold: 0.50
    ela_quality: 90
    max_image_dimension: 2048
    localization_enabled: true
    localization_threshold: 0.40

  field_consistency:
    enabled: true
    model_type: "rule_augmented_consistency_classifier"
    hyperparameters:
      fuzzy_match_threshold: 0.82
      date_format_strict: true
      cgpa_tolerance: 0.05
    decision_threshold: 0.65

  anomaly_detection:
    enabled: true
    model_type: "isolation_forest_anomaly_scorer"
    hyperparameters:
      n_estimators: 100
      contamination: 0.08
      random_state: 20261009
    features:
      - "verification_requests_last_hour"
      - "consecutive_failed_checks"
      - "burst_request_rate_per_sec"
      - "time_of_day_anomaly_score"
      - "metadata_tampering_score"
    anomaly_threshold: -0.15

  cryptographic_verification:
    enabled: true
    type: "deterministic_policy_verifier"
    supported_algorithms:
      - "ECDSA_SECP256R1"
      - "SHA256"
